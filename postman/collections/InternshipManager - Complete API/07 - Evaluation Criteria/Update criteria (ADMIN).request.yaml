$kind: http-request
url: "{{baseUrl}}/api/evaluation_criteria/{{criteriaId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "criterionName": "Postman Technical Skills Updated",
      "description": "Updated criteria",
      "maxScore": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
