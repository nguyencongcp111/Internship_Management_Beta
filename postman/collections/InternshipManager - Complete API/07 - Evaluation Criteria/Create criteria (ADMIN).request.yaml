$kind: http-request
url: "{{baseUrl}}/api/evaluation_criteria"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "criterionName": "Postman Technical Skills",
      "description": "Technical knowledge and implementation",
      "maxScore": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { try { const j=pm.response.json(); if (j && j.data && j.data.id !== undefined) pm.environment.set("criteriaId", j.data.id); } catch(e) {} }
    language: text/javascript
order: 3000
