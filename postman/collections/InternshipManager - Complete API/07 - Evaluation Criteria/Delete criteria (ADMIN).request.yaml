$kind: http-request
url: "{{baseUrl}}/api/evaluation_criteria/{{criteriaId}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
