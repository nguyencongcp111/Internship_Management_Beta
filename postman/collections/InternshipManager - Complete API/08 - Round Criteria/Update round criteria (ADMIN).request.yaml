$kind: http-request
url: "{{baseUrl}}/api/round_criteria/{{roundCriteriaId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "weight": 1,
      "roundId": "{{roundId}}",
      "criteriaId": "{{criteriaId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
