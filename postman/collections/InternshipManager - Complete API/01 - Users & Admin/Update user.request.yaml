$kind: http-request
url: "{{baseUrl}}/api/admin/{{userId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Updated Postman User",
      "email": "{{updatedUserEmail}}",
      "phoneNumber": "0900000103"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      if (pm.response.code >= 200 && pm.response.code < 300) { try { const j=pm.response.json(); if (j && j.data && j.data.id !== undefined) pm.environment.set("unused", j.data.id); } catch(e) {} }
    language: text/javascript
order: 5000
