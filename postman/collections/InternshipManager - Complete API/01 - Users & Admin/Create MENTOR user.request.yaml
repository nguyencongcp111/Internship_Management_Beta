$kind: http-request
url: "{{baseUrl}}/api/admin"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{newMentorUsername}}",
      "password": "ChangeMe123!",
      "fullName": "Postman Mentor",
      "email": "{{newMentorEmail}}",
      "phoneNumber": "0900000102",
      "role": "MENTOR",
      "isActive": true
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { try { const j=pm.response.json(); if (j && j.data && j.data.id !== undefined) pm.environment.set("mentorUserId", j.data.id); } catch(e) {} }
    language: text/javascript
order: 4000
