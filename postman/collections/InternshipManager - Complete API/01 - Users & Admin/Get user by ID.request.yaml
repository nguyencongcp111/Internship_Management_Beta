$kind: http-request
url: "{{baseUrl}}/api/admin/{{userId}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 302 FOUND theo controller hiện tại', () => pm.response.to.have.status(302));
    language: text/javascript
order: 2000
