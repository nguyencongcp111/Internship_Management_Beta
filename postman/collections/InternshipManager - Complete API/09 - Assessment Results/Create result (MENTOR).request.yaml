$kind: http-request
url: "{{baseUrl}}/api/assessment_results"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "assignmentId": "{{assignmentId}}",
      "roundId": "{{roundId}}",
      "criterionId": "{{criteriaId}}",
      "score": 8.5,
      "comments": "Good progress",
      "evaluatedBy": "{{mentorUserId}}",
      "evaluationDate": "25/11/2026 15:30"
    }
auth:
  type: bearer
  credentials:
    token: "{{mentorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { try { const j=pm.response.json(); if (j && j.data && j.data.id !== undefined) pm.environment.set("resultId", j.data.id); } catch(e) {} }
    language: text/javascript
order: 5000
