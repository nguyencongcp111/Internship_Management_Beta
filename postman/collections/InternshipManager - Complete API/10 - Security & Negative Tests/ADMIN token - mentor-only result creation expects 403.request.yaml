$kind: http-request
url: "{{baseUrl}}/api/assessment_results"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "assignmentId": "{{assignmentId}}",
      "roundId": "{{roundId}}",
      "criterionId": "{{criteriaId}}",
      "score": 7,
      "comments": "Forbidden test",
      "evaluatedBy": "{{mentorUserId}}",
      "evaluationDate": "25/11/2026 15:30"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Forbidden', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
