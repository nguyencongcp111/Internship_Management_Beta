$kind: http-request
url: "{{baseUrl}}/api/student"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Forbidden', () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
