$kind: http-request
url: "{{baseUrl}}/api/student"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentCode": "SV_POSTMAN_001",
      "major": "Information Technology",
      "className": "IT01",
      "dateOfBirth": "2003-01-15",
      "address": "Ha Noi",
      "userId": "{{studentUserId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { try { const j=pm.response.json(); if (j && j.data && j.data.id !== undefined) pm.environment.set("studentId", j.data.id); } catch(e) {} }
    language: text/javascript
order: 4000
