$kind: http-request
url: "{{baseUrl}}/api/student/my-profile"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateOfBirth": "2003-01-15",
      "address": "Ha Noi",
      "fullName": "Student Self Update",
      "email": "{{newStudentEmail}}",
      "phoneNumber": "0900000105"
    }
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
