$kind: http-request
url: "{{baseUrl}}/api/internship_assignment"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "assignmentTime": "15-11-2026 09:00",
      "status": "PENDING",
      "studentId": "{{studentId}}",
      "mentorId": "{{mentorId}}",
      "phaseId": "{{phaseId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { try { const j=pm.response.json(); if (j && j.data && j.data.id !== undefined) pm.environment.set("assignmentId", j.data.id); } catch(e) {} }
    language: text/javascript
order: 3000
