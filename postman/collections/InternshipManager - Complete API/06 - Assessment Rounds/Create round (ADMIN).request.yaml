$kind: http-request
url: "{{baseUrl}}/api/assessment_rounds"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "roundName": "Postman Midterm",
      "phaseId": "{{phaseId}}",
      "startDate": "2026-11-21",
      "endDate": "2026-11-25",
      "description": "Created from Postman"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { try { const j=pm.response.json(); if (j && j.data && j.data.id !== undefined) pm.environment.set("roundId", j.data.id); } catch(e) {} }
    language: text/javascript
order: 3000
