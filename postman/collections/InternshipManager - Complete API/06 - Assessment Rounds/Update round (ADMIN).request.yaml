$kind: http-request
url: "{{baseUrl}}/api/assessment_rounds/{{roundId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "roundName": "Postman Midterm Updated",
      "phaseId": "{{phaseId}}",
      "startDate": "2026-11-21",
      "endDate": "2026-11-25",
      "description": "Updated from Postman"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
