$kind: http-request
url: "{{baseUrl}}/api/mentor/{{mentorId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "department": "Computer Science",
      "academicRank": "Senior Lecturer",
      "fullName": "Updated Mentor",
      "email": "{{newMentorEmail}}",
      "phoneNumber": "0900000106"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
