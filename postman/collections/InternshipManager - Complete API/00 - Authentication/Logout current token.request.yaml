$kind: http-request
url: "{{baseUrl}}/api/auth/logout"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: beforeRequest
    code: |-
      const currentToken = pm.environment.get('token');
      if (currentToken) pm.environment.set('loggedOutToken', currentToken);
    language: text/javascript
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
