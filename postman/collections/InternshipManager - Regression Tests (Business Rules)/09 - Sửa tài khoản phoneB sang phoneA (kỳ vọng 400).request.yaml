$kind: http-request
url: "{{baseUrl}}/api/admin/{{adminUserId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "fullName": "Other Account Updated",
      "email": "pm_other_edit_{{uniqueSuffix}}@example.com",
      "phoneNumber": "{{phoneA}}"
    }
scripts:
  - type: afterResponse
    code: |-
      
      pm.test("Từ chối đổi số điện thoại tài khoản sang phoneA đã tồn tại", () => pm.response.to.have.status(400));
    language: text/javascript
order: 10000
