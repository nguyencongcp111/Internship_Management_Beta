$kind: http-request
url: "{{baseUrl}}/api/student/{{studentId}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      
      pm.test("Đọc hồ sơ sinh viên thành công", () => pm.response.to.have.status(200));
      pm.expect(pm.response.json()?.data?.studentCode).to.eql(pm.collectionVariables.get("studentCodeOriginal"));
    language: text/javascript
order: 11000
