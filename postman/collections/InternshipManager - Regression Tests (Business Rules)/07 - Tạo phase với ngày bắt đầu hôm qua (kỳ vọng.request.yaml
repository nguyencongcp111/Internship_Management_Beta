$kind: http-request
name: 07 - Tạo phase với ngày bắt đầu hôm qua (kỳ vọng 400)
url: "{{baseUrl}}/api/internship_phases"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "phaseName": "PM Past Date {{uniqueSuffix}}",
      "startDate": "{{pastDate}}",
      "endDate": "31-12-2099",
      "description": "Must be rejected"
    }
scripts:
  - type: beforeRequest
    code: |-
      
      const now = new Date();
      const fmt = d => [String(d.getDate()).padStart(2,'0'), String(d.getMonth()+1).padStart(2,'0'), d.getFullYear()].join('-');
      const past = new Date(now); past.setDate(past.getDate()-1);
      const future = new Date(now); future.setDate(future.getDate()+30);
      pm.collectionVariables.set("pastDate", fmt(past));
      pm.collectionVariables.set("futureDate", fmt(future));
    language: text/javascript
  - type: afterResponse
    code: |-
      
      pm.test("Không cho tạo phase có startDate trong quá khứ", () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000
